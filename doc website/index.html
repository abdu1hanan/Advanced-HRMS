<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <script>
    (function() {
      var base = document.createElement('base');
      if (window.location.pathname.startsWith('/docs')) {
        base.href = '/docs/';
      } else {
        base.href = '/';
      }
      document.write(base.outerHTML);
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BeetleOps HRMS — Documentation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/content.css">
</head>
<body>
  <button class="mobile-toggle" id="mobileToggle" aria-label="Toggle menu">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
  </button>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <a class="sidebar-brand" href="#/getting-started/introduction">
          <img src="assets/images/logo.png" alt="BeetleOps HRMS" class="sidebar-brand-logo">
          <span class="sidebar-brand-text">BeetleOps HRMS</span>
        </a>
        <div class="search-row">
          <div class="search-box">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="text" class="search-input" id="searchTrigger" placeholder="Search..." readonly>
            <span class="search-kbd">Ctrl K</span>
          </div>
          <button type="button" class="assistant-trigger" id="assistantTrigger" aria-label="Open assistant" title="AI Assistant">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 3l1.5 4.5L18 9l-4.5 1.5L12 15l-1.5-4.5L6 9l4.5-1.5L12 3z"/>
              <path d="M19 13l.75 2.25L22 16l-2.25.75L19 19l-.75-2.25L16 16l2.25-.75L19 13z"/>
            </svg>
          </button>
        </div>
      </div>
      <nav class="sidebar-nav" id="sidebarNav"></nav>
      <div class="sidebar-footer">
        <div class="theme-toggle" id="themeToggle">
          <button type="button" class="theme-btn" data-theme="system" aria-label="System theme" title="System">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
          </button>
          <button type="button" class="theme-btn" data-theme="light" aria-label="Light theme" title="Light">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          </button>
          <button type="button" class="theme-btn active" data-theme="dark" aria-label="Dark theme" title="Dark">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
        </div>
      </div>
    </aside>

    <div class="main-shell">
      <header class="topnav">
        <a class="topnav-link active" href="#/getting-started/introduction">User Guide</a>
        <a class="btn-support" href="#/reference/faq">Support</a>
        <a class="btn-open-app" href="#" onclick="return false;">Open App</a>
      </header>

      <div class="content-shell" id="contentShell">
        <div class="main-scroll">
          <div class="content-container">
            <main class="main">
              <div class="content-wrapper">
                <div class="page-category" id="pageCategory"></div>
                <h1 class="page-title" id="pageTitle">Loading...</h1>
                <p class="page-description" id="pageDescription"></p>
                <div class="prose-wrap">
                  <div class="prose" id="pageContent">
                    <div class="loading">Loading documentation...</div>
                  </div>
                </div>
              </div>
            </main>

            <aside class="toc" id="tocPanel">
              <div class="toc-title">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="15" y2="12"/><line x1="3" y1="18" x2="18" y2="18"/>
                </svg>
                <span>On this page</span>
              </div>
              <ul class="toc-list" id="tocList"></ul>
            </aside>
          </div>
        </div>

        <aside class="assistant-panel" id="assistantPanel">
          <div class="assistant-header">
            <div class="assistant-header-left">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--accent-teal)" stroke-width="2">
                <path d="M12 3l1.5 4.5L18 9l-4.5 1.5L12 15l-1.5-4.5L6 9l4.5-1.5L12 3z"/>
              </svg>
              <span class="assistant-header-title">Assistant</span>
            </div>
            <div class="assistant-header-actions">
              <button type="button" class="assistant-action-btn" aria-label="Expand" title="Expand">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>
                </svg>
              </button>
              <button type="button" class="assistant-close" id="assistantClose" aria-label="Close assistant" title="Close">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
              </button>
            </div>
          </div>
          <div class="assistant-disclaimer">Responses are generated using AI and may contain mistakes.</div>
          <div class="assistant-messages" id="chatMessages"></div>
          <div class="assistant-input-card-wrap">
            <div class="assistant-input-card">
              <textarea class="assistant-input" id="chatInput" placeholder="Ask a question..." rows="1"></textarea>
              <div class="assistant-card-footer">
                <button type="button" class="assistant-attach-btn" aria-label="Attach file" title="Attach file">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
                  </svg>
                </button>
                <button type="button" class="assistant-send" id="chatSend" aria-label="Send message" title="Send">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </aside>
      </div>
    </div>
  </div>

  <div class="search-modal" id="searchModal">
    <div class="search-modal-box">
      <div class="search-modal-input-wrap">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#71717a" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" class="search-modal-input" id="searchModalInput" placeholder="Search docs..." autocomplete="off">
        <span class="search-modal-kbd">ESC</span>
      </div>
      <div class="search-results" id="searchResults"></div>
      <div class="search-modal-footer">
        <span><kbd>↑</kbd> <kbd>↓</kbd> navigate</span>
        <span><kbd>↵</kbd> open</span>
        <span><kbd>esc</kbd> close</span>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/toc.js"></script>
  <script src="js/search.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/chatbot.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
